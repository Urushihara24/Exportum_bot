name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python runtime
        run: python -m py_compile main.py
      - name: Validate shell launcher syntax
        run: bash -n run.sh
      - name: Ensure local environment files are not tracked
        run: |
          if git ls-files '.env' '.env.*' | grep -v '^.env.example$' | grep -q .; then
            echo 'Tracked local environment file detected' >&2
            exit 1
          fi
